<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NEXUS ULTRA Admin</title><link rel="stylesheet" href="/admin/admin.css"></head>
<body><main id="authView" class="auth-wrap"><section class="auth-card"><div class="brand-mark">NU</div><p class="eyebrow">NEXUS ULTRA CONTROL CENTER</p><h1>Admin access</h1><p class="muted">Sign in to manage your store.</p>
<form id="loginForm"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">Sign in</button></form><details><summary>First-time admin setup</summary><p class="muted">Use only once after setting the ADMIN_SETUP_KEY secret in Cloudflare Pages.</p><form id="setupForm"><label>Setup key<input name="key" type="password" required></label><label>Admin name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Password (12+ characters)<input name="password" type="password" minlength="12" required></label><button class="secondary">Create first admin</button></form></details><p id="authMessage" class="message"></p></section></main>
<div id="appView" class="shell" hidden><aside class="sidebar"><div class="brand"><span class="brand-mark">NU</span><span>NEXUS <b>ULTRA</b><small>ADMIN CONSOLE</small></span></div><nav><button data-page="dashboard" class="nav active">▦　Dashboard</button><button data-page="products" class="nav">◇　Products</button><button data-page="categories" class="nav">▤　Categories</button><button data-page="orders" class="nav">▣　Orders</button><button data-page="settings" class="nav">⚙　Settings</button></nav><button id="logoutBtn" class="logout">↪ Sign out</button></aside>
<section class="main"><header><div><p class="eyebrow">STORE MANAGEMENT</p><h1 id="pageTitle">Dashboard</h1></div><div class="user-chip" id="adminName">Administrator</div></header><div id="content"></div><p id="appMessage" class="message"></p></section></div><script src="/admin/admin.js" defer></script></body></html>
